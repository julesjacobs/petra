[package]
name = "vass-reach"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
microlp = "=0.6.0"
varisat = "=0.2.2"

[profile.release]
lto = "thin"

[patch.crates-io]
varisat = { path = "vendor/varisat" }
